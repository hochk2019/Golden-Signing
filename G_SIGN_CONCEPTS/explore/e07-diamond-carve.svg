<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Diamond-carve — Golden Logistics DNA; G + slash in negative</title>

  <!-- diamond / rotated square like logistics mark family -->
  <rect x="512" y="80" width="610" height="610" rx="24"
        transform="rotate(45 512 512)" fill="#D99A22"/>
  <!-- G carved dark -->
  <path d="M640 320 A170 170 0 1 0 640 700"
        fill="none" stroke="#111827" stroke-width="78" stroke-linecap="butt"/>
  <rect x="520" y="470" width="140" height="70" fill="#111827"/>
  <!-- signature slash through diamond -->
  <path d="M280 700 C480 760 680 640 820 380"
        fill="none" stroke="#F4C15D" stroke-width="48" stroke-linecap="round"/>

</svg>
