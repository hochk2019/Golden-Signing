<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Segoe UI, sans-serif">
  <rect width="680" height="320" fill="#F8FAFC"/>
  <!-- Cert dialog -->
  <rect x="24" y="24" width="300" height="270" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="24" y="24" width="300" height="52" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="40" y="48" fill="#1E3A5F" font-size="14" font-weight="600">Chọn chứng thư số</text>
  <text x="40" y="66" fill="#475569" font-size="10">Chứng thư đang có trên USB token</text>
  <rect x="40" y="92" width="268" height="72" rx="8" fill="#E8F0FB" stroke="#1E3A5F"/>
  <circle cx="58" cy="118" r="7" fill="#1E3A5F"/>
  <text x="74" y="114" font-size="11" font-weight="600">CÔNG TY TNHH ABC</text>
  <text x="74" y="132" fill="#475569" font-size="10">MST: 0123456789 · Hết hạn: 2027-12-31</text>
  <rect x="40" y="176" width="268" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="58" cy="204" r="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="74" y="200" font-size="11">CÔNG TY TNHH XYZ</text>
  <text x="200" y="270" font-size="11" fill="#475569">Hủy</text>
  <rect x="230" y="250" width="78" height="28" rx="6" fill="#1E3A5F"/>
  <text x="242" y="268" fill="#FFFFFF" font-size="11">Chọn chứng thư</text>
  <!-- Arrow -->
  <path d="M340 160 H380" stroke="#1E3A5F" stroke-width="2" fill="none"/>
  <path d="M372 152 L384 160 L372 168" fill="#1E3A5F"/>
  <!-- PIN dialog -->
  <rect x="400" y="70" width="256" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="400" y="70" width="256" height="52" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="416" y="94" fill="#1E3A5F" font-size="14" font-weight="600">Nhập PIN chữ ký số</text>
  <text x="416" y="112" fill="#475569" font-size="10">CÔNG TY TNHH ABC</text>
  <rect x="416" y="140" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="428" y="160" fill="#94A3B8" font-size="12">••••••</text>
  <rect x="600" y="140" width="40" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="608" y="160" font-size="10">Hiện</text>
  <text x="416" y="196" fill="#475569" font-size="10">PIN không lưu trên máy tính</text>
  <rect x="540" y="210" width="78" height="28" rx="6" fill="#1E3A5F"/>
  <text x="558" y="228" fill="#FFFFFF" font-size="11">Xác nhận</text>
</svg>
