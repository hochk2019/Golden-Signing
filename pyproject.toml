[project]
name = "golden-signing"
version = "1.1.4"
description = "Golden Sign - PDF digital signature utility for Windows"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "HOC HK", email = "hochk2019@gmail.com" }]
dependencies = [
    "pyHanko[pkcs11,image-support,opentype,qr,etsi]>=0.37.0",
    "pypdfium2>=4.30.0",
    "cryptography>=43.0.0",
    "structlog>=24.0.0",
    "pikepdf>=9.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7.0"]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
golden-signing = "golden_signing.app.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_signing"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["golden_signing"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asn1crypto.*", "pypdfium2.*", "oscrypto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
